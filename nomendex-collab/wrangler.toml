name = "nomendex-collab"
main = "src/index.ts"
compatibility_date = "2024-12-01"

[durable_objects]
bindings = [
    { name = "VaultServer", class_name = "VaultServer" }
]

[[migrations]]
tag = "v1"
new_classes = ["VaultDurableObject"]

[[migrations]]
tag = "v2"
renamed_classes = [{from = "VaultDurableObject", to = "VaultServer"}]

[[d1_databases]]
binding = "DB"
database_name = "nomendex-collab-db"
database_id = "placeholder-will-be-set-after-creation"

[vars]
CLERK_PUBLISHABLE_KEY = "pk_test_cG9zaXRpdmUtc2t1bmstMTEuY2xlcmsuYWNjb3VudHMuZGV2JA"

